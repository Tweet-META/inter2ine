      <section class="doc-section">
        <h2>课程简介</h2>
        <p>正如校内板块中所说，我校的课程分为美方课程和中方课程。详细来说，美方课程包括文学1-4、物理、化学、美国历史、大部分选修课程，中方课程则包括合格考要求的科目、为国际方向做准备的部分课程、和少部分选修课程。</p>
        <p>由于课程种类较多，后文将按年级分类课程，也方便大家查阅。</p>
      </section>

      <section class="doc-section">
        <h2>详细课程</h2>

        <details class="fold">
          <summary>高一</summary>
          <div class="entries">
            <article class="entry">
              <h3>化学（外）</h3>

              <dl class="meta">
                <div>
                  <dt>授课老师</dt>
                  <dd>Mr. Nate</dd>
                </div>
                <div>
                  <dt>课程简介</dt>
                  <dd>Chemistry is the study of matter — everything that has mass and takes up space — and the changes that matter undergoes. It helps us understand what things are made of, how substances interact, and why chemical reactions happen.<br>
                      <br>
                      Some major topics include:<br>
                      Atomic Structure<br>
                      The Periodic Table<br>
                      Bonding<br>
                      Reactions<br>
                      States of Matter<br>
                      Acids and Bases<br>
                      Energy in Chemistry<br>
                      <br>
                      Chemistry connects to many parts of everyday life, from cooking and medicine to batteries, plastics, environmental science, and even the processes occurring inside the human body.<br>
                      It is often called the "central science" because it links physics, biology, geology, medicine, and many other fields.</dd>
                </div>
                <div>
                  <dt>作业情况</dt>
                  <dd>作业大多在Workbook上，有填词和简答，有时会发Worksheet，总体来说量不大。</dd>
                </div>
                <div>
                  <dt>Quiz / Test</dt>
                  <dd>常规下每周五有一次Clicker Quiz，复习为主，只要参与就是满分。<br>考试非常难，时间很不够用，而且会有比较超纲的题目，但考试前会发Study Guide，全背下来肯定是能A的。</dd>
                </div>
                <div>
                  <dt>补充</dt>
                  <dd>Worksheet建议自己做，上课听不懂下课一定要问，还有小心第一次期中考试 ——Tweet-META</dd>
                </div>
              </dl>
            </article>
          </div>
        </details>

        <details class="fold">
          <summary>高二</summary>
          <div class="entries">
            <article class="entry">
              <h3>AP Microeconomics</h3>

              <dl class="meta">
                <div>
                  <dt>授课老师</dt>
                  <dd>张丹 / Nikki</dd>
                </div>
                <div>
                  <dt>课程简介</dt>
                  <dd>AP微观经济学作为大学先修课程，聚焦消费者、厂商等个体决策者的市场行为。核心内容涵盖供需模型、弹性、市场效率、四种市场结构（完全竞争至垄断）及政府政策影响。课程侧重图形分析与逻辑推理，无需高等数学。学习过程中可培养经济直觉，为商科、公共政策等专业奠定基础，通过考试可兑换大学学分。</dd>
                </div>
                <div>
                  <dt>作业情况</dt>
                  <dd>作业量通常不大。课程前期，作业以绘图任务或一道微观经济学大题为主，整体难度偏低。进入AP总复习阶段后，作业主要为完成她发放的大白本练习册里的选择题。</dd>
                </div>
                <div>
                  <dt>Quiz / Test</dt>
                  <dd>会提前告知所有小测与考试安排，Quiz一般针对前几节课所学内容出题，题量较少，十余分钟即可完成。整体而言评分较为宽松，不会在GPA上过度严苛，Quiz成绩不理想时有时还会布置额外作业，可以弥补分数。</dd>
                </div>
              </dl>
            </article>
          </div>
        </details>

        <details class="fold">
          <summary>高三</summary>
          <div class="entries">
            <article class="entry">
              <h3>生物（外）</h3>

              <dl class="meta">
                <div>
                  <dt>授课老师</dt>
                  <dd>Mr. Nate</dd>
                </div>
                <div>
                  <dt>课程简介</dt>
                  <dd>Biology is the study of life and living organisms. It explores how living things are structured, how they function, how they interact with their environment, and how they change over time through evolution.<br>
                      <br>
                      Some major topics include:<br>
                      <br>
                      Cells<br>
                      Genetics<br>
                      Evolution<br>
                      Ecology<br>
                      Classification<br>
                      Human Body Systems<br>
                      Photosynthesis and Respiration<br>
                      <br>
                      Biology is closely connected to everyday life. It helps us understand health and disease, agriculture, conservation, nutrition, medicine, and the natural world around us.<br>
                      <br>
                      Biology is a diverse and rapidly growing science that helps us answer some of humanity's biggest questions: What is life? How did it arise? How are living things connected? And how can we protect the incredible diversity of life on Earth?</dd>
                </div>

                  <dt>作业情况</dt>

                </div>

                </div>
              </dl>
